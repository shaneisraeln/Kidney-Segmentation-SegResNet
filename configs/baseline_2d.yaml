seed: 42

dataset:
  name: KiTS21
  data_dir: kits21/data
  split_dir: data/splits

model:
  name: unet2d
  in_channels: 1
  out_channels: 4

training:
  epochs: 15
  batch_size: 2
  patch_size: [48, 64, 64]
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 10
  gradient_accumulation_steps: 1
  amp: true
  checkpoint_dir: checkpoints/baseline_2d

loss:
  name: dice_ce
  weights: [0.2, 1.0, 3.0, 3.0]

evaluation:
  metrics:
    - dice
    - iou
    - hd95
